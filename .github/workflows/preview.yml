name: PR preview

# Builds each PR and publishes it to
# https://<owner>.github.io/<repo>/pr-preview/pr-<N>/ on the gh-pages branch.
# Each preview is recorded as a GitHub deployment in the "pr-preview/pr-<N>"
# environment, so the PR shows a "View deployment" button. When the PR is
# closed or merged the preview is removed and its deployments are marked inactive.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  deployments: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ENVIRONMENT: pr-preview/pr-${{ github.event.number }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Start deployment
        id: deployment
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.payload.pull_request.head.sha,
              environment: process.env.ENVIRONMENT,
              description: `Preview of PR #${context.issue.number}`,
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: data.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('id', data.id);

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci && npm run lint && npm test && npm run build

      - id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false

      - name: Finish deployment
        if: always() && steps.deployment.outputs.id
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: ok ? 'success' : 'failure',
              environment_url: ok ? process.env.PREVIEW_URL : undefined,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: true,
            });

      - name: Deactivate deployments
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              environment: process.env.ENVIRONMENT,
            });
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: d.id,
                state: 'inactive',
              });
            }
            core.info(`Marked ${deployments.length} deployment(s) inactive`);
