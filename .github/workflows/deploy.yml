name: Deploy to GitHub Pages

# Publishes to the gh-pages branch (Pages source: "Deploy from a branch",
# gh-pages, / root). master goes to the site root; PR previews live under
# pr-preview/ and are managed by preview.yml, so they are kept here.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tdd -- verify
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
